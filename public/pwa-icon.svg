<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#002b5e"/>
  <!-- Ship hull -->
  <path d="M100 310 L412 310 L380 370 Q360 390 256 390 Q152 390 132 370 Z" fill="#00a0e3"/>
  <!-- Ship body -->
  <rect x="140" y="220" width="232" height="95" rx="8" fill="#ffffff"/>
  <!-- Windows row -->
  <rect x="165" y="240" width="25" height="18" rx="4" fill="#00a0e3"/>
  <rect x="205" y="240" width="25" height="18" rx="4" fill="#00a0e3"/>
  <rect x="245" y="240" width="25" height="18" rx="4" fill="#00a0e3"/>
  <rect x="285" y="240" width="25" height="18" rx="4" fill="#00a0e3"/>
  <rect x="325" y="240" width="25" height="18" rx="4" fill="#00a0e3"/>
  <!-- Deck line -->
  <rect x="140" y="220" width="232" height="6" rx="3" fill="#00a0e3"/>
  <!-- Funnel -->
  <rect x="230" y="145" width="52" height="80" rx="6" fill="#002b5e"/>
  <rect x="226" y="138" width="60" height="16" rx="4" fill="#00a0e3"/>
