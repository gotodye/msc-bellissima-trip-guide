  <circle cx="256" cy="118" r="10" fill="#ffffff" opacity="0.4"/>
  <circle cx="268" cy="104" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="276" cy="90" r="6" fill="#ffffff" opacity="0.2"/>
  <!-- Antenna -->
  <line x1="256" y1="138" x2="256" y2="95" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <!-- Water waves -->
  <path d="M80 350 Q128 338 180 350 Q228 362 280 350 Q328 338 380 350 Q420 358 440 350" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
